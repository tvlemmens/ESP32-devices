esphome:
  name: sdl_5inch

host:

logger:
  level: DEBUG

api:
  encryption:
    key: ""

# ---------------------------------------------------------------------------
# FONTS
# ---------------------------------------------------------------------------
font:
  - file: "fonts/Roboto-Medium.ttf"
    id: font_header
    size: 28
    bpp: 4
  - file: "fonts/Roboto-Medium.ttf"
    id: font_med
    size: 20
    bpp: 4
  - file: "fonts/Roboto-Light.ttf"
    id: font_small
    size: 16
    bpp: 4
  - file: "fonts/Roboto-Light.ttf"
    id: font_tiny
    size: 13
    bpp: 4
  - file: "fonts/materialdesignicons-webfont.ttf"
    id: font_icon_lg
    size: 30
    bpp: 4
    glyphs:
      - "\U000F1C99"  # mdi-server

# ---------------------------------------------------------------------------
# IMAGES
# ---------------------------------------------------------------------------
image:
  - file: "img/home-assistant.png"
    id: img_ha
    type: RGB565
    resize: 32x32
  - file: "img/esphome.png"
    id: img_esp
    type: RGB565
    resize: 32x32
  - file: "img/node-red.png"
    id: img_nr
    type: RGB565
    resize: 32x32
  - file: "img/matter.png"
    id: img_matter
    type: RGB565
    resize: 32x32
  - file: "img/mqtt.png"
    id: img_mqtt
    type: RGB565
    resize: 32x32
  - file: "img/music-assistant.png"
    id: img_ma
    type: RGB565
    resize: 32x32

# ---------------------------------------------------------------------------
# TIJD
# ---------------------------------------------------------------------------
time:
  - platform: homeassistant
    id: ha_time

# ---------------------------------------------------------------------------
# SENSOREN
# ---------------------------------------------------------------------------
sensor:
  - platform: homeassistant
    id: ubuntu_cpu
    entity_id: sensor.ubuntu_cpu_usage
    on_value:
      then:
        - lvgl.bar.update:
            id: bar_cpu
            value: !lambda "return (int)x;"
        - lvgl.label.update:
            id: lbl_cpu_val
            text: !lambda |-
              char buf[8];
              snprintf(buf, sizeof(buf), "%d%%", (int)x);
              return std::string(buf);

  - platform: homeassistant
    id: ubuntu_mem
    entity_id: sensor.ubuntu_memory_usage
    on_value:
      then:
        - lvgl.bar.update:
            id: bar_ram
            value: !lambda "return (int)x;"
        - lvgl.label.update:
            id: lbl_ram_val
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%.1f / 10 GB", x / 10.0f);
              return std::string(buf);

  - platform: homeassistant
    id: ubuntu_net_up
    entity_id: sensor.ubuntu_network_upload
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_net_up
            text: !lambda |-
              char buf[12];
              snprintf(buf, sizeof(buf), "%.1f G", x);
              return std::string(buf);

  - platform: homeassistant
    id: ubuntu_net_down
    entity_id: sensor.ubuntu_network_download
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_net_dn
            text: !lambda |-
              char buf[12];
              snprintf(buf, sizeof(buf), "%.1f G", x);
              return std::string(buf);

  - platform: homeassistant
    id: docker_running
    entity_id: sensor.local_containers_running
  - platform: homeassistant
    id: docker_stopped
    entity_id: sensor.local_containers_stopped

  - platform: homeassistant
    id: ubuntu_storage
    entity_id: sensor.ubuntu_disk_usage
    on_value:
      then:
        - lvgl.bar.update:
            id: bar_storage
            value: !lambda "return (int)x;"
        - lvgl.label.update:
            id: lbl_storage_val
            text: !lambda |-
              char buf[8];
              snprintf(buf, sizeof(buf), "%d%%", (int)x);
              return std::string(buf);

  - platform: homeassistant
    id: boss_cpu
    entity_id: sensor.boss_cpu_usage
  - platform: homeassistant
    id: boss_mem
    entity_id: sensor.boss_memory_usage
  - platform: homeassistant
    id: pavilion_cpu
    entity_id: sensor.pavilion_cup_usage
  - platform: homeassistant
    id: pavilion_mem
    entity_id: sensor.pavilion_memory_usage
  - platform: homeassistant
    id: radxa_cpu
    entity_id: sensor.radxa_cpu_usage
  - platform: homeassistant
    id: radxa_mem
    entity_id: sensor.radxa_memory_usage

binary_sensor:
  - platform: homeassistant
    id: ha_status
    entity_id: binary_sensor.homeassistant_status_2
    on_state:
      then:
        - lvgl.widget.update:
            id: dot_ha
            bg_color: !lambda "return x ? lv_color_hex(0x12b76a) : lv_color_hex(0xEB5353);"
        - lvgl.widget.update:
            id: card_ha
            border_color: !lambda "return x ? lv_color_hex(0x12b76a) : lv_color_hex(0xEB5353);"

  - platform: homeassistant
    id: mqtt_status
    entity_id: binary_sensor.mosquitto_status_2
    on_state:
      then:
        - lvgl.widget.update:
            id: dot_mqtt
            bg_color: !lambda "return x ? lv_color_hex(0x12b76a) : lv_color_hex(0xEB5353);"
        - lvgl.widget.update:
            id: card_mqtt
            border_color: !lambda "return x ? lv_color_hex(0x12b76a) : lv_color_hex(0xEB5353);"

  - platform: homeassistant
    id: nodered_status
    entity_id: binary_sensor.node_red_status_2
    on_state:
      then:
        - lvgl.widget.update:
            id: dot_nr
            bg_color: !lambda "return x ? lv_color_hex(0x12b76a) : lv_color_hex(0xEB5353);"
        - lvgl.widget.update:
            id: card_nr
            border_color: !lambda "return x ? lv_color_hex(0x12b76a) : lv_color_hex(0xEB5353);"

# ---------------------------------------------------------------------------
# DISPLAY
# ---------------------------------------------------------------------------
display:
  - platform: sdl
    dimensions:
      width: 800
      height: 480
    id: my_display

