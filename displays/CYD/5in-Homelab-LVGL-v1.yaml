# ---------------------------------------------------------------------------
# INTERVAL
# ---------------------------------------------------------------------------
interval:
  - interval: 5s
    then:
      - lambda: |-
          float up_val = id(ubuntu_net_up).state;
          float dn_val = id(ubuntu_net_down).state;
          if (!std::isnan(up_val)) {
            int pct = (int)std::min(up_val, 100.0f);
            lv_bar_set_value(id(bar_net_up), pct, LV_ANIM_ON);
          }
          if (!std::isnan(dn_val)) {
            int pct = (int)std::min(dn_val, 100.0f);
            lv_bar_set_value(id(bar_net_dn), pct, LV_ANIM_ON);
          }

  - interval: 30s
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          if (t.is_valid()) {
            static const char* months[] = {
              "JAN","FEB","MAR","APR","MAY","JUN",
              "JUL","AUG","SEP","OCT","NOV","DEC"
            };
            char buf[24];
            snprintf(buf, sizeof(buf), "%02d:%02d, %02d %s",
              t.hour, t.minute, t.day_of_month, months[t.month - 1]);
            lv_label_set_text(id(lbl_clock), buf);
          }
